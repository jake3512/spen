name: Build APK

on:
  push:
    branches:
      - claude/spen-side-button-hotkey-4f5m28
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spen-hotkey-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a GitHub Release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "S펜 핫키 debug APK (build ${{ github.run_number }})" \
            --notes "자동 빌드된 디버그 APK입니다. 설치 전 설정 > 보안에서 '알 수 없는 앱 설치'를 허용해야 합니다. 테스트되지 않은 빌드이니 문제가 있으면 알려주세요."
